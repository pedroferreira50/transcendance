#   cp .env.example .env    # then set JWT_SECRET
#   docker compose -f docker-compose.test.yml up --build

services:
  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - certs:/etc/nginx/certs
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file (see .env.example)}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://localhost:8443}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/users.db}
    volumes:
      - backend-data:/app/data
    expose:
      - "3000"
    restart: unless-stopped

volumes:
  certs:
  backend-data: