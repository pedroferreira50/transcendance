services:
  # The only entry point: HTTPS on 8443 (8080 redirects to it).
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.dev
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_BACKEND_URL=http://backend:3000
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend-data:/app/data
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DATABASE_URL=file:/app/data/users.db

volumes:
  backend-data:
  certs:
